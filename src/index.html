<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photobooth</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1>Photobooth</h1>
        <p>Capture a photo and add a custom frame.</p>
      </div>
    </header>

    <main class="container">
      <section id="captureScreen" class="screen">
        <div class="booth">
          <div class="preview">
            <video
              id="camera"
              class="mirrored filtered"
              autoplay
              playsinline
              muted
            ></video>
            <canvas id="canvas" class="hidden"></canvas>
            <img id="frameOverlay" class="frame" alt="Selected frame" />
          </div>

          <div class="controls-panel">
            <div class="status">
              <span id="captureCount">0</span> /
              <span id="captureMax">10</span> photos
            </div>
            <div class="controls">
              <button id="startCamera" class="primary">Start camera</button>
              <button id="capturePhoto">Capture</button>
            </div>
            <p class="hint">Take up to 10 photos. You'll pick 4 later.</p>
          </div>
        </div>

        <section class="frames">
          <h2>Choose a frame set</h2>
          <div class="frame-list" id="frameList">
            <button class="frame-option is-active" data-frame="">
              <span>No frame</span>
            </button>
            <button class="frame-option" data-frame-set="set-01">
              <span>Frame Set 01</span>
            </button>
          </div>
        </section>
      </section>

      <section id="selectionScreen" class="screen hidden">
        <div class="selection-header">
          <h2>Build your photo strip</h2>
          <p>Select a slot, then choose a photo from your 10 captures.</p>
        </div>
        <div class="selection-body">
          <div class="strip">
            <button class="strip-slot is-active" data-slot="0" type="button">
              <img class="strip-photo" alt="Strip slot 1 photo" />
              <img class="strip-frame" alt="Strip slot 1 frame" />
              <span>1</span>
            </button>
            <button class="strip-slot" data-slot="1" type="button">
              <img class="strip-photo" alt="Strip slot 2 photo" />
              <img class="strip-frame" alt="Strip slot 2 frame" />
              <span>2</span>
            </button>
            <button class="strip-slot" data-slot="2" type="button">
              <img class="strip-photo" alt="Strip slot 3 photo" />
              <img class="strip-frame" alt="Strip slot 3 frame" />
              <span>3</span>
            </button>
            <button class="strip-slot" data-slot="3" type="button">
              <img class="strip-photo" alt="Strip slot 4 photo" />
              <img class="strip-frame" alt="Strip slot 4 frame" />
              <span>4</span>
            </button>
          </div>

          <div class="thumbnail-panel">
            <h3>Choose 4 of 10</h3>
            <div class="thumbnail-grid" id="thumbnailGrid"></div>
            <div class="controls">
              <button id="downloadStrip" class="primary">Download strip</button>
              <button id="startOver">Start over</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>Tip: Add your PNG/SVG frames in <code>src/assets/frames</code>.</small>
      </div>
    </footer>

    <script src="./scripts/main.js"></script>
  </body>
</html>
